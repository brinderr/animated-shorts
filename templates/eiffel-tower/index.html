<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="56.89"
      data-width="1080"
      data-height="1920"
    >
      
      <audio
        id="a-roll-audio"
        src="voice_fast.wav"
        data-start="0"
        data-duration="56.89"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <div id="world" class="clip" data-start="0" data-duration="56.89" data-track-index="1" data-track-kind="graphics" style="position:absolute;inset:0;">
        <canvas id="three-layer" width="1080" height="1920" style="width:1080px;height:1920px;display:block;"></canvas>
      </div>
      <!--
        Add your clips here. Example:
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1"
             style="font-size: 64px; color: #fff; padding: 40px">
          Hello World
        </div>
      -->
    </div>

    <script>
      const tl = gsap.timeline({ paused: true, onUpdate: () => { if (window.__renderAt) window.__renderAt(tl.time()); } });
      tl.to({ v: 0 }, { v: 1, duration: 56.89, ease: "none" }, 0);
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="assets/scene.js"></script>
  </body>
</html>
